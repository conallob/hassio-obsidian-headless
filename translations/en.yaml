configuration:
  obsidian_auth_token:
    name: Obsidian Auth Token
    description: >-
      Your Obsidian Sync auth token. Obtain it by running:
      `npx obsidian-headless get-token` and following the prompts.
  vault_name:
    name: Vault Name
    description: >-
      The exact name of your Obsidian vault as it appears in Obsidian Sync.
      Case-sensitive. Run `ob sync-list-remote` to confirm the name.
  vault_password:
    name: Vault Encryption Password
    description: >-
      Only required if your vault has end-to-end encryption enabled
      (Settings → Sync → Encryption password in Obsidian). Leave blank if not used.
  enable_mcp:
    name: Enable MCP Server
    description: >-
      Expose your vault as a remote MCP server so AI assistants (e.g. Claude)
      can read and search your notes.
  mcp_auth_token:
    name: MCP Bearer Token
    description: >-
      A long random secret used to authenticate MCP clients via Bearer token.
      Generate with: `openssl rand -hex 32`
      Required when enable_mcp is true (unless using OAuth).
  oauth_client_id:
    name: OAuth Client ID
    description: >-
      OAuth 2.1 client identifier. Defaults to 'vault-mcp-client'.
      Only needed when using OAuth authentication for the MCP server.
  oauth_client_secret:
    name: OAuth Client Secret
    description: >-
      OAuth 2.1 client secret. Required when using OAuth for MCP auth.
      Generate with: `openssl rand -hex 32`
  tunnel_mode:
    name: Tunnel Mode
    description: >-
      How the MCP server is exposed externally.
      'none': only reachable on your local network (port 8420).
      'tailscale': exposed on your Tailnet via Tailscale.
      'https': expects an external reverse proxy terminating TLS.
  tailscale_auth_key:
    name: Tailscale Auth Key
    description: >-
      Tailscale auth key for this device. Generate a reusable key at
      https://login.tailscale.com/admin/settings/keys
      Required when tunnel_mode is 'tailscale'.
  tls_cert_path:
    name: TLS Certificate Path
    description: >-
      Path to your TLS certificate file (PEM format).
      The /ssl directory is mapped from your HA SSL folder.
      Default: /ssl/fullchain.pem
  tls_key_path:
    name: TLS Private Key Path
    description: >-
      Path to your TLS private key file (PEM format).
      Default: /ssl/privkey.pem
  enable_remarkable:
    name: Enable reMarkable Sync
    description: >-
      Sync documents between your reMarkable tablet and your Obsidian vault.
      Downloads reMarkable docs as PDFs into <vault>/reMarkable/.
      Optionally uploads PDFs back to reMarkable (see remarkable_bidirectional).
  remarkable_one_time_code:
    name: reMarkable One-Time Code
    description: >-
      One-time registration code for the reMarkable Cloud API.
      Obtain it at https://my.remarkable.com/device/desktop/new
      Only required on first run; credentials are cached in /data/rmapi/ afterwards.
      Clear this field after successful first sync.
  remarkable_rm_folder:
    name: reMarkable Folder
    description: >-
      Folder on your reMarkable to sync from (and upload to).
      Use '/' for the root (all documents). Example: '/My Books'
  remarkable_obsidian_folder:
    name: Obsidian Destination Folder
    description: >-
      Subfolder inside your Obsidian vault where synced PDFs are stored.
      Default: 'reMarkable'. Place PDFs in '<folder>/Upload/' to upload them
      to your reMarkable tablet.
  remarkable_sync_interval:
    name: Sync Interval (minutes)
    description: >-
      How often to sync with reMarkable Cloud, in minutes. Default: 60.
      For an immediate on-demand sync, create the file /data/.remarkable-sync-now
      (e.g. via an HA shell command automation).
  remarkable_bidirectional:
    name: Bidirectional Sync
    description: >-
      When enabled, PDFs placed in <vault>/reMarkable/Upload/ are uploaded
      to your reMarkable and moved to <vault>/reMarkable/Uploaded/.
      When disabled, sync is one-way: reMarkable → Obsidian only.

network:
  8420/tcp: MCP HTTP server port
