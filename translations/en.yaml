configuration:
  obsidian_auth_token:
    name: Obsidian Auth Token
    description: >-
      Your Obsidian Sync auth token. Obtain it by running:
      `npx obsidian-headless get-token` and following the prompts.
  vault_name:
    name: Vault Name
    description: >-
      The exact name of your Obsidian vault as it appears in Obsidian Sync.
      Case-sensitive. Run `ob sync-list-remote` to confirm the name.
  vault_password:
    name: Vault Encryption Password
    description: >-
      Only required if your vault has end-to-end encryption enabled
      (Settings → Sync → Encryption password in Obsidian). Leave blank if not used.
  enable_mcp:
    name: Enable MCP Server
    description: >-
      Expose your vault as a remote MCP server so AI assistants (e.g. Claude)
      can read and search your notes.
  mcp_auth_token:
    name: MCP Bearer Token
    description: >-
      A long random secret used to authenticate MCP clients via Bearer token.
      Generate with: `openssl rand -hex 32`
      Required when enable_mcp is true (unless using OAuth).
  oauth_client_id:
    name: OAuth Client ID
    description: >-
      OAuth 2.1 client identifier. Defaults to 'vault-mcp-client'.
      Only needed when using OAuth authentication for the MCP server.
  oauth_client_secret:
    name: OAuth Client Secret
    description: >-
      OAuth 2.1 client secret. Required when using OAuth for MCP auth.
      Generate with: `openssl rand -hex 32`
  mcp_allowed_hosts:
    name: MCP Allowed Hosts
    description: >-
      Comma-separated Host header value(s) clients will connect with, e.g.
      'homeassistant.local:8420' or 'obsidian.conall.dev'. Required (besides
      127.0.0.1/localhost, always allowed) for any external tunnel_mode, or
      requests fail with 'Invalid Host header'. Must match exactly; a
      trailing ':*' wildcards the port only.
  tunnel_mode:
    name: Tunnel Mode
    description: >-
      How the MCP server is exposed externally.
      'none': only reachable on your local network (port 8420).
      'tailscale': exposed on your Tailnet via Tailscale. Requires
      mcp_auth_token and oauth_client_secret.
      'https': expects an external reverse proxy terminating TLS. Requires
      mcp_auth_token.
      'cloudflare': traffic arrives via a Cloudflare Tunnel managed by the
      separate cloudflared add-on. Set cf_access_team_domain and
      cf_access_aud for native Cloudflare Access JWT validation (no
      mcp_auth_token/oauth_client_secret needed), otherwise requires
      mcp_auth_token and oauth_client_secret same as 'tailscale'.
  tailscale_auth_key:
    name: Tailscale Auth Key
    description: >-
      Tailscale auth key for this device. Generate a reusable key at
      https://login.tailscale.com/admin/settings/keys
      Required when tunnel_mode is 'tailscale'.
  tls_cert_path:
    name: TLS Certificate Path
    description: >-
      Path to your TLS certificate file (PEM format).
      The /ssl directory is mapped from your HA SSL folder.
      Default: /ssl/fullchain.pem
  tls_key_path:
    name: TLS Private Key Path
    description: >-
      Path to your TLS private key file (PEM format).
      Default: /ssl/privkey.pem
  cf_access_team_domain:
    name: Cloudflare Access Team Domain
    description: >-
      Your Zero Trust team domain, e.g. 'your-team.cloudflareaccess.com'.
      Set together with cf_access_aud to have the MCP server validate
      Cloudflare Access JWTs directly instead of using oauth_client_secret.
      Only used when tunnel_mode is 'cloudflare'.
  cf_access_aud:
    name: Cloudflare Access Application AUD Tag
    description: >-
      The Application Audience (AUD) tag of the Access application
      protecting this hostname (Zero Trust → Access → Applications → your
      app → Overview). Required together with cf_access_team_domain.
  enable_remarkable:
    name: Enable reMarkable Sync
    description: >-
      Sync documents from your reMarkable tablet into your Obsidian vault.
      Pair your device at the registration UI on port 8421 — no config field
      needed for credentials. One-way sync: reMarkable → Obsidian.
  remarkable_output_dir:
    name: reMarkable Destination Folder
    description: >-
      Subfolder inside your Obsidian vault where synced notes are stored.
      Default: 'reMarkable'.
  remarkable_sync_interval:
    name: Sync Interval (seconds)
    description: >-
      How often to poll reMarkable Cloud for new/updated documents, in
      seconds. Default: 300.
  remarkable_tag_prefix:
    name: reMarkable Tag Prefix
    description: >-
      Prepended to every reMarkable label mapped to an Obsidian tag, e.g.
      'remarkable:' turns the label 'mylabel' into 'remarkable:mylabel'.
      Leave blank to overlay reMarkable labels into Obsidian tags unchanged.
  remarkable_extra_tags:
    name: reMarkable Extra Tags
    description: >-
      Comma-separated tags added to every document synced from reMarkable,
      in addition to its own labels. Example: 'remarkable'.
  enable_git_sync:
    name: Enable Git Vault Sync
    description: >-
      Periodically pull git repos that live as subdirectories of the vault.
      Obsidian Sync does not propagate .git metadata, so this fetches
      directly from each repo's remote instead.
  git_repos:
    name: Git Repos
    description: >-
      One repo per line: '<vault-relative-path>|<remote-url>[|<branch>]'.
      Branch defaults to 'main'. Example: 'Homelab|https://github.com/you/homelab.git'.
  git_sync_interval:
    name: Git Sync Interval (seconds)
    description: >-
      How often to fetch/pull all configured git_repos, in seconds.
      Default: 900.
  git_auth_token:
    name: Git Auth Token
    description: >-
      Fine-grained GitHub personal access token, read-only, scoped to just
      the private repos in git_repos. Not needed for public repos.

network:
  8420/tcp: MCP HTTP server port
