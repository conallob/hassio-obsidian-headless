name: Build & Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OBSIDIAN_HEADLESS_VERSION: "0.0.12"

jobs:
  build:
    name: Build image (${{ matrix.build_arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            build_from: ghcr.io/home-assistant/amd64-base-debian:bookworm
          - build_arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_from: ghcr.io/home-assistant/aarch64-base-debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Compute version
        id: version
        run: |
          REF="${{ github.ref }}"
          if [[ "${REF}" == refs/tags/v* ]]; then
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: build
        run: |
          podman build \
            --build-arg BUILD_FROM=${{ matrix.build_from }} \
            --build-arg BUILD_ARCH=${{ matrix.build_arch }} \
            --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} \
            --build-arg OBSIDIAN_HEADLESS_VERSION=${{ env.OBSIDIAN_HEADLESS_VERSION }} \
            --manifest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ matrix.build_arch }} \
            .

      - name: Push arch image
        if: github.event_name != 'pull_request'
        run: |
          podman manifest push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ matrix.build_arch }} \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ matrix.build_arch }}

  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Compute tags
        id: tags
        run: |
          REF="${{ github.ref }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:edge"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${TAGS} ${IMAGE}:${SHA_SHORT}"
          if [[ "${REF}" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            TAGS="${TAGS} ${IMAGE}:${VERSION}"
            MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
            TAGS="${TAGS} ${IMAGE}:${MAJOR_MINOR}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          podman manifest create --all multi-arch-manifest \
            docker://${IMAGE}:build-amd64 \
            docker://${IMAGE}:build-aarch64
          for tag in ${{ steps.tags.outputs.tags }}; do
            podman manifest push multi-arch-manifest "docker://${tag}"
          done

      - name: Inspect manifest
        run: |
          podman manifest inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
